name: Publish npm package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/test.yml
  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Validate release version
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('Release tag must match package.json version')
          }
          const tag = version.includes('-') ? 'next' : 'latest'
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`)
          NODE
      - run: bun install --frozen-lockfile
      - name: Set repository metadata for provenance
        run: >-
          npm pkg set repository.type=git
          repository.url="git+https://github.com/${GITHUB_REPOSITORY}.git"
      - name: Publish with npm trusted publishing
        run: npm publish --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.tag }}
