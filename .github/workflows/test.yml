name: Test

on:
  push:
    branches: [dev, dev-*]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run test:package
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run playwright install --with-deps chromium firefox webkit
      - run: bun run test:browser

  kernels:
    name: Real kernel API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-go@v7
        with:
          go-version: ^1.26
          cache-dependency-path: |
            test/servers/sing-box/go.sum
            test/servers/mihomo/go.sum
      - run: bun install --frozen-lockfile
      - name: Check OpenSSL for local HTTPS fixtures
        run: openssl version
      - name: Build and test sing-box and mihomo servers
        run: bun run test:kernels
